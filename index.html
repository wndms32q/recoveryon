function bindProfile(){$('#addHistory').onclick=()=>editHistory();$$('[data-history-edit]').forEach(b=>b.onclick=()=>editHistory(b.dataset.historyEdit));$$('[data-history-delete]').forEach(b=>b.onclick=()=>{if(confirm('이전 수술 기록을 삭제할까요?')){state.surgeryHistory=state.surgeryHistory.filter(x=>x.id!==b.dataset.historyDelete);save();renderProfile()}});$('#changeEmail').onclick=changeEmail;$('#resetPassword').onclick=resetPassword;$('#profileLogout').onclick=logoutUser;$('#profileSync').onclick=()=>$('#syncNow').click();$('#requestNotify').onclick=requestNotificationPermission;$$('[data-notify]').forEach(b=>b.onclick=()=>{const key=b.dataset.notify;state.notificationSettings[key]=!state.notificationSettings[key];save();renderProfile()});$$('[data-med-time]').forEach(input=>input.onchange=()=>{const med=state.meds.find(x=>x.id===Number(input.dataset.medTime));med.time=input.value;save();render();toast('복약 시간을 변경했습니다.')});$$('[data-med-notify]').forEach(b=>b.onclick=()=>{const med=state.meds.find(x=>x.id===Number(b.dataset.medNotify));med.notify=!med.notify;save();renderProfile()})}
function editHistory(id){const old=state.surgeryHistory.find(x=>x.id===id);const name=prompt('수술 이름',old?.name||'');if(!name)return;const date=prompt('수술일 (YYYY-MM-DD)',old?.date||dateInput(new Date()));if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('수술일 형식을 확인해 주세요.');const status=confirm('회복이 종료된 기록인가요?')?'회복 종료':'진행 중';const rehab=prompt('재활 내용 또는 회복 메모',old?.rehab||'')||'';const item={id:old?.id||String(Date.now()),name:name.trim(),date,status,rehab:rehab.trim(),durationDays:status==='회복 종료'?daysSince(date):null};if(old)Object.assign(old,item);else state.surgeryHistory.unshift(item);save();renderProfile();toast(old?'수술 기록을 수정했습니다.':'이전 수술 기록을 추가했습니다.')}
async function changeEmail(){if(!cloudSession)return toast('로그인이 필요합니다.');const value=prompt('변경할 새 이메일 주소',cloudSession.user.email||'');if(!value||!/^\S+@\S+\.\S+$/.test(value))return toast('이메일 주소를 확인해 주세요.');const {error}=await supabaseClient.auth.updateUser({email:value});if(error){console.error(error);return toast('이메일 변경 요청에 실패했습니다.')}toast('새 이메일로 확인 링크를 보냈습니다.')}
async function resetPassword(){const email=cloudSession?.user?.email;if(!email)return toast('로그인이 필요합니다.');const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error){console.error(error);return toast('재설정 메일 전송에 실패했습니다.')}toast('비밀번호 재설정 메일을 보냈습니다.')}

async function requestNotificationPermission(){if(!('Notification'in window))return toast('이 브라우저는 알림을 지원하지 않습니다.');const permission=await Notification.requestPermission();toast(permission==='granted'?'알림을 허용했습니다.':'알림이 허용되지 않았습니다.')}
const notifiedSlots=new Set();function checkScheduledNotifications(){if(document.hidden||!state.notificationSettings?.medications||Notification.permission!=='granted')return;const now=new Date(),key=dateInput(now),time=now.toTimeString().slice(0,5);state.meds.forEach(m=>{const slot=key+'-'+m.id+'-'+m.time;if(m.notify&&m.time===time&&!notifiedSlots.has(slot)){new Notification('회복온 복약 알림',{body:`${m.name} 복용 시간입니다. 복용 후 완료를 기록해 주세요.`});notifiedSlots.add(slot)}})}setInterval(checkScheduledNotifications,30000);
function showPage(id){$$('.page').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$$('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$('#main').scrollTop=0;render();if(id==='profile')renderProfile()}$$('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$$('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));$('#pain').oninput=e=>$('#painValue').textContent=e.target.value;$('#painNote').oninput=e=>$('#painNoteCount').textContent=e.target.value.length+'/500';$('#painSave').onclick=()=>{const button=$('#painSave');if(button.disabled)return;const note=$('#painNote').value.trim();flashButton(button,'loading','저장 중');try{const ok=commit(()=>state.pain.push({id:Date.now(),value:Number($('#pain').value),note,at:new Date().toISOString()}),'통증을 저장했습니다.');if(ok===false)throw new Error('RENDER_FAILED');$('#painNote').value='';$('#painNoteCount').textContent='0/500';flashButton(button,'success','저장 완료',900)}catch(error){console.error('pain save',error);flashButton(button,'error','다시 시도',1400)}};const resetDemoButton=$('#reset');if(resetDemoButton)resetDemoButton.onclick=()=>{if(confirm('모든 데모 데이터를 초기화할까요?')){state=normalizeState(initial);save();showPage('today');toast('초기화했습니다.')}};
function openDetail(type){$('#detail').classList.remove('hidden');$('#detailTitle').textContent={wound:'상처 기록 달력',summary:'진료 요약',symptom:'증상 기록',feedback:'의료진 피드백',pain:'통증 기록'}[type]||'상세';if(type==='wound')woundView();if(type==='summary')summary();if(type==='symptom')$('#detailBody').innerHTML=`<div class="card">${state.symptoms.map(s=>`<div class="row"><b>${s.type} · ${s.severity}/10</b><p>${esc(s.note)}</p></div>`).join('')}</div>`;if(type==='feedback')$('#detailBody').innerHTML=`<div class="card">${state.feedback.map(f=>`<div class="row">${esc(f.message)}</div>`).join('')}</div>`;if(type==='pain')$('#detailBody').innerHTML=`<div class="card"><h2>통증 기록</h2>${state.pain.slice().reverse().map(p=>`<div class="row"><b>${p.value}/10</b><div class="muted">${new Date(p.at).toLocaleString('ko-KR')}</div>${p.note?`<p style="white-space:pre-wrap">${esc(p.note)}</p>`:'<p class="muted">메모 없음</p>'}</div>`).join('')}</div>`}$('#back').onclick=()=>{$('#detail').classList.add('hidden');pending=[];editingId=null;render()};
function woundView(){editingId=null;pending=[];calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);$('#detailBody').innerHTML=`<div class="card"><div class="warn">사진과 메모는 날짜별 기록용이며 자동 진단에 사용하지 않습니다.</div><label>기록 날짜<input id="rDate" type="date" value="${dateInput(new Date())}"></label><label>사진 추가<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="pending" class="photos"></div><label>상처 상태 메모<textarea id="note" maxlength="500"></textarea></label><div id="chars" class="muted" style="text-align:right">0/500</div><div class="actions"><button id="cancel" class="btn secondary hidden">수정 취소</button><button id="saveW" class="btn primary">기록 저장</button><button id="retryW" class="btn secondary hidden">저장 재시도</button></div></div><div class="card"><div class="between"><b>날짜별 기록 달력</b><button id="thisMonth" class="btn secondary">이번 달</button></div><div class="between" style="margin-top:9px"><button id="prev" class="btn secondary">‹</button><b id="month"></b><button id="next" class="btn secondary">›</button></div><div id="cal" class="calendar"></div><div id="dateLabel" class="muted" style="margin-top:10px"></div><div id="dayList"></div></div>` ;const note=$('#note'),rDate=$('#rDate'),input=$('#files');function resetDraft(nextDate){selectedDate=new Date(nextDate||new Date());pending.length=0;editingId=null;note.value='';input.value='';rDate.value=dateInput(selectedDate);$('#chars').textContent='0/500';$('#cancel').classList.add('hidden');$('#saveW').textContent='기록 저장';renderPending()}note.oninput=()=>$('#chars').textContent=note.value.length+'/500';rDate.onchange=()=>{if(!rDate.value)return;resetDraft(new Date(rDate.value+'T12:00:00'));renderCal()};input.onchange=async e=>{const files=[...e.target.files],valid=files.filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type)&&f.size<=8*1024*1024).slice(0,5-pending.length);if(valid.length!==files.length)toast('JPEG, PNG, WEBP만 가능하며 최대 5장·사진당 8MB입니다.');for(const f of valid){const src=await readFile(f);pending.push({id:Date.now()+Math.random(),name:f.name,size:Math.round(f.size/1024)+'KB',src})}e.target.value='';renderPending()};function renderPending(){$('#pending').innerHTML=pending.map((p,i)=>`<div class="photo"><img src="${p.src}" alt="사진 미리보기"><div class="photofoot"><span>${esc(p.name)} · ${p.size}</span><button class="btn danger" data-rp="${i}">삭제</button></div></div>`).join('');$$('[data-rp]').forEach(b=>b.onclick=()=>{pending.splice(Number(b.dataset.rp),1);renderPending()})}function clearForm(){resetDraft(new Date())}$('#cancel').onclick=clearForm;async function submitWound(payload){const saveButton=$('#saveW'),retryButton=$('#retryW');if(saveButton.disabled)return;saveButton.disabled=true;saveButton.textContent='클라우드 저장 중...';retryButton.classList.add('hidden');setCloudStatus('busy','저장 중');try{await cloudSaveWound(payload.id,payload.dateValue,payload.note,payload.images);lastFailedWoundSave=null;const d=new Date(payload.dateValue+'T12:00:00');flashButton(saveButton,'success','저장 완료',500);resetDraft(d);woundView();toast(payload.wasEditing?'기록을 수정했습니다.':'기록을 저장했습니다.')}catch(error){console.error(error);lastFailedWoundSave=payload;saveButton.disabled=false;saveButton.textContent=payload.wasEditing?'수정 내용 저장':'기록 저장';retryButton.classList.remove('hidden');if(error.message==='OFFLINE'){setOffline();toast('오프라인입니다. 입력 내용은 유지됩니다.')}else{setCloudStatus('error','저장 실패');toast('저장에 실패했습니다. 입력 내용은 유지됩니다.')}}}$('#saveW').onclick=()=>{const n=note.value.trim(),dateValue=rDate.value;if(!dateValue)return toast('날짜를 선택해 주세요.');if(!n&&!pending.length)return toast('사진 또는 메모를 입력해 주세요.');submitWound({id:editingId,dateValue,note:n,images:pending.map(x=>({...x})),wasEditing:Boolean(editingId)})};$('#retryW').onclick=()=>{if(lastFailedWoundSave)submitWound(lastFailedWoundSave)};function edit(id){const w=state.wounds.find(x=>x.id===id);editingId=id;pending=w.images.map(x=>({...x}));note.value=w.note;rDate.value=w.recordDate||dateInput(new Date(w.savedDate));$('#chars').textContent=note.value.length+'/500';$('#cancel').classList.remove('hidden');$('#saveW').textContent='수정 내용 저장';renderPending();$('#detailBody').scrollTop=0}function card(w){return `<div class="row"><div class="between"><div><b>${w.savedAt}</b><div class="muted">사진 ${w.photoCount}장${w.updatedAt?' · 수정됨':''}</div></div><div><button class="btn secondary" data-edit="${w.id}">수정</button> <button class="btn danger" data-del="${w.id}">삭제</button></div></div>${w.images.length?`<div class="photos">${w.images.map(i=>`<div class="photo"><img src="${i.src}" alt="상처 사진"></div>`).join('')}</div>`:''}<p style="white-space:pre-wrap">${esc(w.note||'메모 없음')}</p></div>`}function bind(){$$('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$$('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('기록을 삭제할까요?'))return;try{await cloudDeleteWound(b.dataset.del);woundView();toast('삭제했습니다.')}catch(error){console.error(error);toast('클라우드 삭제에 실패했습니다.')}})}function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}function renderCal(){$('#month').textContent=`${calendarMonth.getFullYear()}년 ${calendarMonth.getMonth()+1}월`;const heads=['일','월','화','수','목','금','토'];let h=heads.map(x=>`<div class="muted" style="text-align:center;font-weight:800">${x}</div>`).join('');const first=calendarMonth.getDay(),last=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){const date=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),d),n=state.wounds.filter(w=>(w.recordDate||dateInput(new Date(w.savedDate)))===dateInput(date)).length;h+=`<button class="day ${same(date,selectedDate)?'active':''}" data-day="${d}">${d}${n?`<small>${n}건</small>`:''}</button>`}$('#cal').innerHTML=h;$$('[data-day]').forEach(b=>b.onclick=()=>{const nextDate=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),Number(b.dataset.day));resetDraft(nextDate);renderCal()});const selectedKey=dateInput(selectedDate);const vals=state.wounds.filter(w=>(w.recordDate||dateInput(new Date(w.savedDate)))===selectedKey);$('#dateLabel').textContent=selectedDate.toLocaleDateString('ko-KR')+'에 저장된 기록 '+vals.length+'건';$('#dayList').innerHTML=vals.length?vals.map(card).join(''):'<div class="empty" style="margin-top:8px">이 날짜의 기록이 없습니다.</div>';bind()}$('#prev').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCal()};$('#thisMonth').onclick=()=>{const today=new Date();calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);resetDraft(today);renderCal()};renderPending();renderCal()}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(f)})}function dateInput(v){const d=new Date(v),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function summary(){const p=state.pain.at(-1).value;$('#detailBody').innerHTML=`<div class="card"><h2>진료 요약</h2><div class="grid"><div class="row">복약<br><b>${state.meds.filter(x=>x.done).length}/3</b></div><div class="row">재활<br><b>${state.rehab.filter(x=>x.done).length}/3</b></div><div class="row">상처<br><b>${state.wounds.length}건</b></div><div class="row">통증<br><b>${p}/10</b></div></div></div>`}function tests(){const sample={id:9,savedDate:new Date().toISOString(),savedAt:'오늘',note:'수정 전',images:[],photoCount:0},copy=clone(sample);copy.note='수정 후';return[{name:'날짜별 기록 필드',pass:['id','savedDate','savedAt','note','images','photoCount'].every(k=>k in sample)},{name:'수정 시 원본 ID 유지',pass:copy.id===sample.id},{name:'사진 배열 깊은 복사',pass:copy.images!==sample.images},{name:'달력 기록 수 계산',pass:[sample].filter(x=>dateInput(x.savedDate)===dateInput(new Date())).length===1},{name:'공통 상태 연동',pass:state.tasks.length===4}]};function applyViewportHeight(){document.documentElement.style.setProperty('--app-height',window.innerHeight+'px')}applyViewportHeight();window.addEventListener('resize',applyViewportHeight,{passive:true});window.visualViewport?.addEventListener('resize',applyViewportHeight,{passive:true});document.addEventListener('focusin',event=>{if(event.target.matches('input,select,textarea'))setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),180)});$('#authLogin').onclick=login;$('#authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});window.addEventListener('online',()=>{setCloudStatus('busy','재연결 중');initCloud()});window.addEventListener('offline',setOffline);window.addEventListener('error',event=>{if(event.error)console.error('runtime',event.error)});window.addEventListener('unhandledrejection',event=>{console.error('promise',event.reason)});$('#cloudRetry').onclick=()=>$('#syncNow').click();$('#syncNow').onclick=async()=>{const button=$('#syncNow');if(button.disabled)return;setCloudStatus('busy','동기화 중');flashButton(button,'loading','동기화 중');try{await initCloud();if($('#store').classList.contains('online'))flashButton(button,'success','동기화 완료',1100);else flashButton(button,'error','다시 시도',1400)}catch(error){console.error('manual sync',error);setCloudStatus('error',cloudErrorText(error));flashButton(button,'error','다시 시도',1400)}};$('#retryApp').onclick=()=>{hideRecovery();render();if(cloudSession&&navigator.onLine)loadCloudWounds().catch(error=>{console.error(error);showRecovery('클라우드 데이터를 다시 불러오지 못했습니다.')})};$('#goHome').onclick=()=>{hideRecovery();$('#detail').classList.add('hidden');showPage('today')};const versionEl=$('#appVersion');if(versionEl)versionEl.textContent=`버전 ${APP_VERSION} · ${APP_VERSION_LABEL}`;installButtonFeedback();initCloud().catch(error=>{console.error('startup',error);setCloudStatus('error',cloudErrorText(error))});
</script></body></html>
