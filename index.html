<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>회복온 통합 앱</title><style>
*{box-sizing:border-box}body{margin:0;background:#dbe4e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}.app{height:100vh;height:100dvh;max-width:390px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:#f8fafc;position:relative}@media(min-width:440px){body{padding:16px}.app{height:min(760px,calc(100dvh - 32px));border:8px solid #0f172a;border-radius:36px;box-shadow:0 20px 55px #0f172a30}}header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid #e2e8f0}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:#0f766e;color:#fff;font-size:22px;font-weight:900}.head{min-width:0}.head b,.head small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head small{color:#64748b}.store{margin-left:auto;border-radius:999px;padding:6px 9px;background:#d1fae5;color:#065f46;font-size:11px;font-weight:800}main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px}.page{display:none}.page.active{display:block}.hero{border-radius:24px;background:linear-gradient(135deg,#115e59,#0891b2);color:#fff;padding:20px;margin-bottom:12px}.hero h1{margin:8px 0;font-size:25px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:15px;margin-bottom:12px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.task,.row{border:1px solid #e2e8f0;border-radius:16px;padding:10px;margin-top:8px}.task{display:flex;align-items:center;gap:8px}.task.done{background:#ecfdf5;border-color:#86efac}.check{width:44px;height:44px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;color:transparent;font-size:20px}.task.done .check{background:#059669;border-color:#059669;color:#fff}.open{min-height:44px;flex:1;border:0;background:transparent;text-align:left;font-weight:800}.btn{min-height:44px;border:0;border-radius:12px;padding:9px 12px;font-weight:800}.primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.muted{font-size:12px;color:#64748b;line-height:1.5}label{display:block;font-size:13px;font-weight:800;margin-top:12px}input,select,textarea{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:12px;padding:11px;font:inherit;font-size:16px;background:#fff}textarea{min-height:105px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu{min-height:78px;border:0;border-radius:16px;background:#ecfdf5;text-align:left;padding:12px;font-weight:800}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.photo{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}.photo img{width:100%;height:110px;object-fit:cover}.photofoot{display:flex;gap:4px;align-items:center;padding:7px}.photofoot span{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}.empty{padding:22px;text-align:center;background:#f1f5f9;border-radius:15px;color:#64748b;font-size:13px}.warn{padding:12px;border-radius:15px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;font-size:12px;line-height:1.6}.badge{display:inline-block;border-radius:999px;background:#d1fae5;color:#065f46;padding:4px 8px;font-size:11px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.day{min-height:46px;border:0;border-radius:10px;background:#f1f5f9;font-weight:800;padding:3px}.day.active{background:#0f766e;color:#fff}.day small{display:block;font-size:9px}.hidden{display:none!important}nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#fff;border-top:1px solid #e2e8f0;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav button{min-height:54px;border:0;border-radius:12px;background:transparent;color:#64748b;font-size:10px;font-weight:800}nav button.active{background:#0f766e;color:#fff}.detail{position:absolute;inset:0;z-index:20;background:#f8fafc;display:flex;flex-direction:column}.detailhead{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 12px}.detailbody{flex:1;min-height:0;overflow-y:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}.toast{position:absolute;z-index:40;left:12px;right:12px;bottom:76px;background:#0f172a;color:#fff;border:0;border-radius:14px;padding:13px;font-weight:800}.ok{color:#047857}.fail{color:#b91c1c}
</style></head><body><div class="app"><header><div class="logo">+</div><div class="head"><b>회복온</b><small>환자 · 연주은 · 무릎 수술 D+7 · v1.3 날짜격리</small></div><span id="store" class="store">저장 준비</span></header><main id="main"><section id="today" class="page active"><div class="hero"><small>오늘의 회복</small><h1>수술 후 7일째예요</h1><div class="between"><span>오늘 완료율</span><b id="progress">0%</b></div></div><div class="card"><div class="between"><h2>오늘의 체크리스트</h2><b id="taskCount"></b></div><div id="taskList"></div></div><div class="card"><div class="between"><b>현재 통증</b><b id="painValue">3</b></div><input id="pain" type="range" min="0" max="10"><button id="painSave" class="btn primary" style="width:100%;margin-top:8px">통증 기록 저장</button></div></section><section id="meds" class="page"><div class="card"><h1>오늘의 약 복용</h1><div id="medList"></div></div></section><section id="rehab" class="page"><div class="hero" style="background:linear-gradient(135deg,#4338ca,#7c3aed)"><small>의료진 승인 일정</small><h1>오늘의 재활</h1><div class="between"><span>완료율</span><b id="rehabPct"></b></div></div><div id="rehabList"></div></section><section id="records" class="page"><div class="card"><h1>회복 기록</h1><div class="grid"><button class="menu" data-detail="wound">상처 기록<br><small id="woundCount">0건</small></button><button class="menu" data-detail="summary">진료 요약</button><button class="menu" data-detail="symptom">증상 기록</button><button class="menu" data-detail="feedback">의료진 피드백</button></div></div></section><section id="profile" class="page"><div class="card"><h1>내 회복 정보</h1><div id="profile"></div><button id="reset" class="btn danger" style="width:100%;margin-top:10px">데이터 초기화</button></div><div class="card"><h2>자동 검사</h2><div id="tests" class="muted"></div></div></section></main><nav><button class="active" data-page="today">오늘</button><button data-page="meds">복약</button><button data-page="rehab">재활</button><button data-page="records">기록</button><button data-page="profile">내 정보</button></nav><button id="toast" class="toast hidden"></button><section id="detail" class="detail hidden"><div class="detailhead"><button id="back" class="btn secondary">←</button><b id="detailTitle">상세</b></div><div id="detailBody" class="detailbody"></div></section></div><script>
'use strict';
const KEY='recoveryon-calendar-v3';const initial={version:1,tasks:[{id:'med',title:'아침 처방약 복용 기록',detail:'meds'},{id:'wound',title:'상처 상태 확인',detail:'wound'},{id:'rehab',title:'승인된 재활 일정 확인',detail:'rehab'},{id:'pain',title:'통증 정도 기록',detail:'pain'}],meds:[{id:1,name:'아침약',time:'08:00',done:true},{id:2,name:'점심약',time:'13:00',done:false},{id:3,name:'저녁약',time:'20:00',done:false}],rehab:[{id:1,title:'발목 펌프 운동',time:'10:00',done:false},{id:2,title:'보행 연습',time:'15:00',done:false},{id:3,title:'회복 상태 기록',time:'19:00',done:false}],pain:[{id:1,value:3,at:new Date().toISOString()}],wounds:[],symptoms:[{id:1,type:'통증 변화',severity:4,note:'걷고 난 뒤 불편함'}],feedback:[{id:1,message:'등록한 기록을 확인했습니다.'}]};const clone=x=>JSON.parse(JSON.stringify(x));let state=load(),pending=[],editingId=null,calendarMonth=new Date(),selectedDate=new Date();const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1){v.wounds=(v.wounds||[]).filter(r=>r&&r.savedDate&&!Number.isNaN(new Date(r.savedDate).getTime())).map(r=>({...r,recordDate:r.recordDate||dateInput(new Date(r.savedDate)),images:(r.images||[]).map(i=>({...i}))}));return v}}catch(e){console.error(e)}return clone(initial)}function save(){try{localStorage.setItem(KEY,JSON.stringify(compact(state)));$('#store').textContent='저장 완료';return true}catch(e){console.error(e);$('#store').textContent='발표 모드';return false}}function compact(v){const c=clone(v);c.wounds.forEach(r=>r.images.forEach(i=>i.src=i.src&&i.src.length<500000?i.src:''));return c}function sync(){state.tasks.find(x=>x.id==='med').done=state.meds[0].done;state.tasks.find(x=>x.id==='wound').done=state.wounds.length>0;state.tasks.find(x=>x.id==='rehab').done=state.rehab.every(x=>x.done);state.tasks.find(x=>x.id==='pain').done=state.pain.length>1}function commit(fn,msg){fn();sync();save();render();if(msg)toast(msg)}function toast(t){const b=$('#toast');b.textContent=t;b.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>b.classList.add('hidden'),2200)}$('#toast').onclick=()=>$('#toast').classList.add('hidden');
function render(){sync();const done=state.tasks.filter(x=>x.done).length;$('#progress').textContent=Math.round(done/4*100)+'%';$('#taskCount').textContent=done+'/4';$('#taskList').innerHTML=state.tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-check="${t.id}">✓</button><button class="open" data-open="${t.detail}">${t.title} ›</button></div>`).join('');$$('[data-check]').forEach(b=>b.onclick=()=>{const id=b.dataset.check;if(id==='med')commit(()=>state.meds[0].done=!state.meds[0].done);else if(id==='rehab')commit(()=>state.rehab.forEach(x=>x.done=!state.tasks.find(t=>t.id==='rehab').done));else toast('상세 화면에서 기록을 저장해 주세요.')});$$('[data-open]').forEach(b=>b.onclick=()=>['meds','rehab'].includes(b.dataset.open)?showPage(b.dataset.open):openDetail(b.dataset.open));$('#medList').innerHTML=state.meds.map(m=>`<div class="row"><div class="between"><div><b>${m.name}</b><div class="muted">${m.time}</div></div><span class="badge">${m.done?'완료':'예정'}</span></div><div class="actions"><button class="btn primary" data-med="${m.id}" data-v="1">완료</button><button class="btn secondary" data-med="${m.id}" data-v="0">되돌리기</button></div></div>`).join('');$$('[data-med]').forEach(b=>b.onclick=()=>commit(()=>state.meds.find(x=>x.id===Number(b.dataset.med)).done=b.dataset.v==='1','복약 상태를 저장했습니다.'));const rc=state.rehab.filter(x=>x.done).length;$('#rehabPct').textContent=Math.round(rc/3*100)+'%';$('#rehabList').innerHTML=state.rehab.map(r=>`<div class="card"><div class="between"><div><b>${r.title}</b><div class="muted">${r.time} · 의료진 승인</div></div><button class="btn ${r.done?'secondary':'primary'}" data-rehab="${r.id}">${r.done?'완료 해제':'활동 완료'}</button></div></div>`).join('');$$('[data-rehab]').forEach(b=>b.onclick=()=>commit(()=>state.rehab.find(x=>x.id===Number(b.dataset.rehab)).done=!state.rehab.find(x=>x.id===Number(b.dataset.rehab)).done));const p=state.pain.at(-1).value;$('#painValue').textContent=p;$('#pain').value=p;$('#woundCount').textContent=state.wounds.length+'건';$('#profile').innerHTML=[['복약',state.meds.filter(x=>x.done).length+'/3'],['재활',rc+'/3'],['상처 기록',state.wounds.length+'건'],['최근 통증',p+'/10']].map(x=>`<div class="row"><small class="muted">${x[0]}</small><b style="display:block">${x[1]}</b></div>`).join('');$('#tests').innerHTML=tests().map(x=>`<div class="${x.pass?'ok':'fail'}">${x.pass?'통과':'실패'} · ${x.name}</div>`).join('')}
function showPage(id){$$('.page').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$$('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$('#main').scrollTop=0;render()}$$('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$$('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));$('#pain').oninput=e=>$('#painValue').textContent=e.target.value;$('#painSave').onclick=()=>commit(()=>state.pain.push({id:Date.now(),value:Number($('#pain').value),at:new Date().toISOString()}),'통증을 저장했습니다.');$('#reset').onclick=()=>{if(confirm('모든 데모 데이터를 초기화할까요?')){state=clone(initial);save();showPage('today');toast('초기화했습니다.')}};
function openDetail(type){$('#detail').classList.remove('hidden');$('#detailTitle').textContent={wound:'상처 기록 달력',summary:'진료 요약',symptom:'증상 기록',feedback:'의료진 피드백',pain:'통증 기록'}[type]||'상세';if(type==='wound')woundView();if(type==='summary')summary();if(type==='symptom')$('#detailBody').innerHTML=`<div class="card">${state.symptoms.map(s=>`<div class="row"><b>${s.type} · ${s.severity}/10</b><p>${esc(s.note)}</p></div>`).join('')}</div>`;if(type==='feedback')$('#detailBody').innerHTML=`<div class="card">${state.feedback.map(f=>`<div class="row">${esc(f.message)}</div>`).join('')}</div>`;if(type==='pain')$('#detailBody').innerHTML=`<div class="card">${state.pain.slice().reverse().map(p=>`<div class="row"><b>${p.value}/10</b><div class="muted">${new Date(p.at).toLocaleString('ko-KR')}</div></div>`).join('')}</div>`}$('#back').onclick=()=>{$('#detail').classList.add('hidden');pending=[];editingId=null;render()};
function woundView(){editingId=null;pending=[];calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);$('#detailBody').innerHTML=`<div class="card"><div class="warn">사진과 메모는 날짜별 기록용이며 자동 진단에 사용하지 않습니다.</div><label>기록 날짜<input id="rDate" type="date" value="${dateInput(new Date())}"></label><label>사진 추가<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="pending" class="photos"></div><label>상처 상태 메모<textarea id="note" maxlength="500"></textarea></label><div id="chars" class="muted" style="text-align:right">0/500</div><div class="actions"><button id="cancel" class="btn secondary hidden">수정 취소</button><button id="saveW" class="btn primary">기록 저장</button></div></div><div class="card"><div class="between"><b>날짜별 기록 달력</b><button id="thisMonth" class="btn secondary">이번 달</button></div><div class="between" style="margin-top:9px"><button id="prev" class="btn secondary">‹</button><b id="month"></b><button id="next" class="btn secondary">›</button></div><div id="cal" class="calendar"></div><div id="dateLabel" class="muted" style="margin-top:10px"></div><div id="dayList"></div></div>` ;const note=$('#note'),rDate=$('#rDate');note.oninput=()=>$('#chars').textContent=note.value.length+'/500';$('#files').onchange=async e=>{const files=[...e.target.files],valid=files.filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type)&&f.size<=8*1024*1024).slice(0,5-pending.length);if(valid.length!==files.length)toast('JPEG, PNG, WEBP만 가능하며 최대 5장·사진당 8MB입니다.');for(const f of valid){const src=await readFile(f);pending.push({id:Date.now()+Math.random(),name:f.name,size:Math.round(f.size/1024)+'KB',src})}e.target.value='';renderPending()};function renderPending(){$('#pending').innerHTML=pending.map((p,i)=>`<div class="photo"><img src="${p.src}" alt="사진 미리보기"><div class="photofoot"><span>${esc(p.name)} · ${p.size}</span><button class="btn danger" data-rp="${i}">삭제</button></div></div>`).join('');$$('[data-rp]').forEach(b=>b.onclick=()=>{pending.splice(Number(b.dataset.rp),1);renderPending()})}function clearForm(){editingId=null;pending=[];note.value='';rDate.value=dateInput(new Date());$('#chars').textContent='0/500';$('#cancel').classList.add('hidden');$('#saveW').textContent='기록 저장';renderPending()}$('#cancel').onclick=clearForm;$('#saveW').onclick=()=>{const n=note.value.trim();if(!rDate.value)return toast('날짜를 선택해 주세요.');if(!n&&!pending.length)return toast('사진 또는 메모를 입력해 주세요.');const d=new Date(rDate.value+'T12:00:00');if(editingId){commit(()=>{const old=state.wounds.find(x=>x.id===editingId);old.recordDate=rDate.value;old.savedDate=d.toISOString();old.savedAt=d.toLocaleDateString('ko-KR');old.note=n;old.images=pending.map(x=>({...x}));old.photoCount=pending.length;old.updatedAt=new Date().toISOString()},'기록을 수정했습니다.')}else{commit(()=>state.wounds.unshift({id:Date.now(),recordDate:rDate.value,savedDate:d.toISOString(),savedAt:d.toLocaleDateString('ko-KR'),note:n,images:pending.map(x=>({...x})),photoCount:pending.length}),'기록을 저장했습니다.')}selectedDate=d;woundView()};function edit(id){const w=state.wounds.find(x=>x.id===id);editingId=id;pending=w.images.map(x=>({...x}));note.value=w.note;rDate.value=w.recordDate||dateInput(new Date(w.savedDate));$('#chars').textContent=note.value.length+'/500';$('#cancel').classList.remove('hidden');$('#saveW').textContent='수정 내용 저장';renderPending();$('#detailBody').scrollTop=0}function card(w){return `<div class="row"><div class="between"><div><b>${w.savedAt}</b><div class="muted">사진 ${w.photoCount}장${w.updatedAt?' · 수정됨':''}</div></div><div><button class="btn secondary" data-edit="${w.id}">수정</button> <button class="btn danger" data-del="${w.id}">삭제</button></div></div>${w.images.length?`<div class="photos">${w.images.map(i=>`<div class="photo"><img src="${i.src}" alt="상처 사진"></div>`).join('')}</div>`:''}<p style="white-space:pre-wrap">${esc(w.note||'메모 없음')}</p></div>`}function bind(){$$('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('기록을 삭제할까요?')){commit(()=>state.wounds=state.wounds.filter(x=>x.id!==Number(b.dataset.del)),'삭제했습니다.');woundView()}})}function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}function renderCal(){$('#month').textContent=`${calendarMonth.getFullYear()}년 ${calendarMonth.getMonth()+1}월`;const heads=['일','월','화','수','목','금','토'];let h=heads.map(x=>`<div class="muted" style="text-align:center;font-weight:800">${x}</div>`).join('');const first=calendarMonth.getDay(),last=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){const date=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),d),n=state.wounds.filter(w=>(w.recordDate||dateInput(new Date(w.savedDate)))===dateInput(date)).length;h+=`<button class="day ${same(date,selectedDate)?'active':''}" data-day="${d}">${d}${n?`<small>${n}건</small>`:''}</button>`}$('#cal').innerHTML=h;$$('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),Number(b.dataset.day));rDate.value=dateInput(selectedDate);renderCal()});const selectedKey=dateInput(selectedDate);const vals=state.wounds.filter(w=>(w.recordDate||dateInput(new Date(w.savedDate)))===selectedKey);$('#dateLabel').textContent=selectedDate.toLocaleDateString('ko-KR')+'에 저장된 기록 '+vals.length+'건';$('#dayList').innerHTML=vals.length?vals.map(card).join(''):'<div class="empty" style="margin-top:8px">이 날짜의 기록이 없습니다.</div>';bind()}$('#prev').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCal()};$('#thisMonth').onclick=()=>{selectedDate=new Date();calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);renderCal()};renderPending();renderCal()}
